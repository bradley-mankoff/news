name: Bug report
description: Something does not work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: Ownership
      description: Files or components this issue owns. Use function-level areas when sharing a file; declare ownership before moving the issue to Todo.
      placeholder: |
        - Files/areas: news_pipeline/foo.py (function), tests/test_foo.py
      render: markdown
    validations:
      required: true
  - type: input
    id: depends_on
    attributes:
      label: Depends on
      description: Issue refs that must be in the Done lane before this starts. Leave empty if none.
      placeholder: "#42, #57"
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: One per line, each binary — a reviewer answers YES or NO without judgement (e.g. "The bug no longer reproduces with ..."). The implementation workflow reports evidence for each.
      placeholder: |
        - The bug no longer reproduces with ...
        - ...
      render: markdown
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Explicitly excluded work — anything listed here is not done in this issue (it may be future work); anything NOT listed here is part of this issue and must be delivered with it (docs, tests, validation included). Leave empty if nothing is excluded.
      placeholder: |
        - The ... will be handled separately
      render: markdown
    validations:
      required: false
