  - id: us_politics
    title: US Politics
    description: >
      US federal political news: White House and executive branch actions (executive orders,
      presidential decisions, cabinet moves), Congress (House and Senate votes, committee
      hearings, legislation), Supreme Court and federal judiciary rulings, Trump and Biden
      administrations, federal agencies (DOJ, DHS, State Department, Defense), presidential
      and congressional elections and campaigns, campaign fundraising and polling,
      US immigration and border policy enforcement, government shutdowns and debt ceiling
      debates, and any significant political power struggle at the US federal level. Excludes
      state and local politics unless they carry national significance.
