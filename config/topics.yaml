  - id: us_economy
    title: US Economy
    description: >
      US macroeconomic news directly affecting American households, workers, borrowers, savers,
      and broad markets: Federal Reserve interest rate decisions and monetary policy, inflation
      and consumer prices (CPI, PCE, grocery/gas/rent prices), employment and jobs reports
      (nonfarm payrolls, jobless claims, JOLTS, unemployment rate, wage growth), GDP and economic
      growth, consumer spending and confidence, housing market (mortgage rates, home sales, starts),
      stock and bond markets (S&P 500, Dow, Nasdaq, Treasury yields), major US corporate earnings
      and layoffs affecting workers, tariff effects on household budgets, and any economic data
      that shapes the financial lives of Americans. Excludes purely international economic
      developments unless they directly drive US conditions.
