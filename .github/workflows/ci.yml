name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck automation scripts
        run: shellcheck automation/*.sh
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev
      - name: Install Chromium for browser tests
        run: uv run python -m playwright install --with-deps chromium
      - name: Run tests
        run: uv run python -m pytest -q

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare trusted scanner inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA:-}" ]]; then
            echo "::error::Secret scan requires github.event.pull_request.base.sha" >&2
            exit 1
          fi
          if [[ -z "${HEAD_SHA:-}" ]]; then
            echo "::error::Secret scan requires github.event.pull_request.head.sha" >&2
            exit 1
          fi

          scan_root="$RUNNER_TEMP/gitleaks-repo"
          trusted_root="$RUNNER_TEMP/trusted-gitleaks"
          rm -rf "$scan_root" "$trusted_root"
          mkdir -p "$scan_root" "$trusted_root"
          cp -a "$GITHUB_WORKSPACE/." "$scan_root/"
          # Gitleaks always loads the target's .gitleaksignore. Remove both
          # policy files from the PR checkout before scanning it.
          rm -f "$scan_root/.gitleaks.toml" "$scan_root/.gitleaksignore"

          if git cat-file -e "${BASE_SHA}:.gitleaks.toml" 2>/dev/null; then
            git show "${BASE_SHA}:.gitleaks.toml" > "$trusted_root/gitleaks.toml"
          else
            # Explicitly selecting a config prevents PR policy discovery while
            # retaining Gitleaks' built-in rules for repositories without a
            # base-owned custom configuration.
            printf '[extend]\nuseDefault = true\n' > "$trusted_root/gitleaks.toml"
          fi
          if git cat-file -e "${BASE_SHA}:.gitleaksignore" 2>/dev/null; then
            git show "${BASE_SHA}:.gitleaksignore" > "$trusted_root/.gitleaksignore"
          else
            : > "$trusted_root/.gitleaksignore"
          fi

      - name: Secret scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA:-}" ]]; then
            echo "::error::Secret scan requires github.event.pull_request.base.sha" >&2
            exit 1
          fi
          if [[ -z "${HEAD_SHA:-}" ]]; then
            echo "::error::Secret scan requires github.event.pull_request.head.sha" >&2
            exit 1
          fi
          docker run --rm \
            --volume "$RUNNER_TEMP/gitleaks-repo:/repo:ro" \
            --volume "$RUNNER_TEMP/trusted-gitleaks:/trusted:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --config /trusted/gitleaks.toml \
            --gitleaks-ignore-path /trusted/.gitleaksignore \
            --ignore-gitleaks-allow \
            --redact --no-banner --no-color --verbose --exit-code 1 \
            --log-opts="--diff-merges=first-parent ${BASE_SHA}..${HEAD_SHA}" \
            /repo
