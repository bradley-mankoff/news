  - id: us_economy
    title: US Economy
    description: >
      US-centered macroeconomic news where the United States is the main economy affected and
      the article frames consequences for American households, workers, borrowers, savers,
      consumers, businesses, investors, or broad US markets. Includes Federal Reserve interest
      rate decisions and monetary policy, US inflation and consumer prices (CPI, PCE,
      grocery/gas/rent prices), US employment and jobs reports (nonfarm payrolls, jobless claims,
      JOLTS, unemployment rate, wage growth), US GDP and economic growth, American consumer
      spending and confidence, US housing market conditions (mortgage rates, home sales, starts),
      US stock and bond markets (S&P 500, Dow, Nasdaq, Treasury yields), major US corporate
      earnings and layoffs affecting workers, tariff effects on American household budgets, and
      economic data that shapes the financial lives of people in the United States. International
      economic developments belong here only when the story explicitly centers their direct effect
      on US inflation, jobs, consumers, financial markets, trade policy, Federal Reserve policy, or
      household costs.
    rationale: Stories about how the US economy affects American households, workers, consumers, borrowers, savers, and broad markets.
    required_context_terms:
      - united states economy
      - united states inflation
      - united states jobs
      - united states labor market
