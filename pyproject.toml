[project]
name = "personal_code"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "langchain-openai",
    "langchain-community",
    "langchain",
    "langgraph>=1.1.3",
    "ddgs>=8.1.1",
    "datetime",
    "trafilatura",
    "beautifulsoup4",
    "duckduckgo-search>=8.1.1",
    "mlx-lm; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mflux>=0.16.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pillow>=10.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
todays-news = "news_pipeline.cli:main"
