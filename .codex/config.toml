default_permissions = "news_core"

[permissions.news_core.filesystem]
":minimal" = "read"
glob_scan_max_depth = 8

[permissions.news_core.filesystem.":project_roots"]
"." = "write"
"README.md" = "none"
"SETTINGS.md" = "none"
"REVIEW.md" = "none"
"TO_DO_LIST.txt" = "none"
"git_cheat_sheet.txt" = "none"
"tests" = "none"
"tests/**" = "none"
".venv" = "none"
".venv/**" = "none"
".venv-x86_64-backup" = "none"
".venv-x86_64-backup/**" = "none"
".venv-x86_64-backup-2" = "none"
".venv-x86_64-backup-2/**" = "none"
"__pycache__" = "none"
"__pycache__/**" = "none"

".DS_Store" = "none"

".pytest_cache" = "none"
".pytest_cache/**" = "none"
".mypy_cache" = "none"
".mypy_cache/**" = "none"
".ruff_cache" = "none"
".ruff_cache/**" = "none"
".cursor" = "none"
".cursor/**" = "none"
".vscode" = "none"
".vscode/**" = "none"
