# Project-scoped Archon config
# Inherits defaults from the archon-pi home config (~/.local/share/archon-pi/archon-home/config.yaml).
# Reference: https://archon.diy/reference/configuration/

assistant: pi

# Workflow PRs and worktrees are based on the integration branch (develop);
# main is production and only receives reviewed ship PRs (see README).
worktree:
  baseBranch: develop

# Curated workflow set (project-scoped): bundled defaults are disabled so only
# the pi-usable workflows installed in the archon home `workflows/` dir are
# discovered. Claude-only workflows are archived under
# ~/.local/share/archon-pi/archon-home/workflows-archived/ (not discovered).
# Inventory + restore instructions: docs/archon-workflows.md
defaults:
  loadDefaultWorkflows: false

# Pinned in the archon web UI for this project.
recommendedWorkflows:
  - archon-fix-github-issue
  - archon-idea-to-pr
  - archon-plan-to-pr
  - archon-smart-pr-review
  - archon-comprehensive-pr-review
  - piyaz-batch
  - piyaz-maintain
