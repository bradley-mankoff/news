[project]
name = "personal_code"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "langchain-openai",
    "trafilatura",
    "beautifulsoup4",
    "mlx-lm; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mflux>=0.16.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pillow>=10.0.0",
    "pyyaml>=6.0.3",
    "mlx-vlm>=0.5.0 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "sentence-transformers>=3.0.0",
    "numpy>=1.24.0",
    "googlenewsdecoder>=0.1.7",
    "duckdb>=1.4.4",
]

[project.scripts]
news = "news_pipeline.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["news_pipeline*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "coverage>=7.0",
]

[tool.coverage.run]
source = ["news_pipeline"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
