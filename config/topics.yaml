  - id: us_politics
    title: US Politics
    description: >
      US-centered federal political news where the United States government, national political
      institutions, federal officials, federal courts, national elections, or nationwide policy are
      the central actors or direct targets. Includes White House and executive branch actions
      (executive orders, presidential decisions, cabinet moves), Congress (House and Senate votes,
      committee hearings, legislation), Supreme Court and federal judiciary rulings, Trump and Biden
      administrations, federal agencies (DOJ, DHS, State Department, Defense), presidential and
      congressional elections and campaigns, campaign fundraising and polling, US immigration and
      border policy enforcement, government shutdowns and debt ceiling debates, and significant
      political power struggles at the US federal level. Foreign political developments belong here
      only when the article explicitly centers a US government response, US law or policy, American
      elections, Congress, the White House, federal courts, or direct consequences for US national
      politics. State and local politics belong here only when they carry clear national or federal
      significance.
