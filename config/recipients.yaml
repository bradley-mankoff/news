# Email recipients for generated reports.
#
# Usage:
# - pause: true keeps the recipient configured but skips delivery.
# - personal_prompt can customize the final synthesis for one recipient or a
#   group of recipients sharing the exact same prompt.
# - NEWS_RUN_MODE=dev and NEWS_RUN_MODE=local-prod always send only to
#   NEWS_DEV_RECIPIENT, regardless of this file.
recipients:
  - email: bradley@mankoff.com
    name: Bradley Mankoff
    personal_prompt: null
    pause: false
