# Predefined topic vocabulary for article relevance matching.
#
# Each topic has:
#   description: Natural-language description used for semantic (embedding) classification.
#                This is the primary signal for routing articles to topics.
#   required_context_terms: At least one must appear in article/story text for keyword scoring.
#                           Acts as a secondary validation gate after embedding classification.
#   keywords / boost_phrases: Used for keyword-based relevance scoring at story-assignment stage.
#
topics:
  - id: global_crises_conflict
    title: Global Crises & Conflict
    description: >
      Large-scale events with major global security or humanitarian implications: armed conflicts
      and wars (Ukraine-Russia, Gaza, Iran, Sudan, etc.), military escalations, airstrikes and
      missile attacks, coup attempts and state collapse, ethnic cleansing and genocide, nuclear
      threats and arms races, major cross-border terrorist attacks, refugee crises, mass civilian
      casualties, and any event where state or organized violence shapes international security or
      threatens populations at scale. Includes peace talks and ceasefire negotiations. Excludes
      minor local crime; focuses on events affecting multiple countries or with global strategic
      significance.
    rationale: Stories about wars, armed conflicts, military escalation, ceasefires, cross-border attacks, and state or proxy violence involving countries or major armed groups.
