  - id: global_business_finance
    title: Global Business & Finance
    description: >
      Business and financial news with global significance: major mergers and acquisitions
      worldwide, corporate bankruptcies and restructurings, large IPOs and significant startup
      funding rounds (Series C and above), major corporate layoffs of tens of thousands, central
      bank decisions outside the US, currency and commodity market movements with global impact
      (oil prices, gold, major currency swings), BRICS financial and banking developments,
      international trade deals and tariff disputes between major economies, global supply chain
      disruptions, and major developments at multinational companies that reshape industries.
      Excludes routine quarterly earnings; includes events that signal major economic shifts,
      power realignments between companies, or structural changes in global finance.
    rationale: Stories about global company, market, finance, trade, earnings, deal, investment, and investor developments that matter to executives or markets more than household economic conditions.
