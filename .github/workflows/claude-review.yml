name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write
  issues: write

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
          prompt: |
            Review the pull request at ${{ github.repository }}/pull/${{ github.event.pull_request.number }}.

            Steps:
            1. Read REVIEW.md in the repo root for review standards.
            2. Run `gh pr diff ${{ github.event.pull_request.number }}` to see the changes.
            3. Read any specific files you need context on (be selective).
            4. Post inline comments on specific problematic lines using mcp__github_inline_comment__create_inline_comment.
            5. Finish with one summary comment via `gh pr comment ${{ github.event.pull_request.number }} --body "..."` containing your verdict.

            Note: this code is authored by GPT-5.5 on high reasoning. Focus on catching things a model with different priors than GPT might miss — not stylistic preferences.
            Be efficient. Don't re-read files. Don't try tools that aren't in the allowed list.
