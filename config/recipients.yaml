# Email recipients for generated reports.
#
# Checked-in file is a public template with example entries. Real recipients
# are configured in a local copy referenced by NEWS_RECIPIENTS_YAML (see
# SETTINGS.md). Do not commit real addresses.
#
# Usage:
# - pause: true keeps the recipient configured but skips delivery.
# - NEWS_RECIPIENT_SCOPE=primary sends only to the primary recipient,
#   regardless of this file.
recipients:
  - email: you@example.com
    name: Example Recipient
    pause: false
