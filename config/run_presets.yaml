# Saved run presets for the daily news pipeline.
#
# Run Presets are env-style defaults. Shell/UI overrides still win.
presets:
  default:
    name: Default
    description: My sense of the default
    env:
      NEWS_SOURCE_SCOPE: peripheral
      NEWS_RECIPIENT_SCOPE: primary
      NEWS_BLOCK_REUSED_URLS: '0'
      NEWS_IMAGE_ENABLED: '0'
      NEWS_MODEL: gemma-4-12b-it-4bit
  dev:
    name: Dev
    description: Small core-source review run with the Codex-safe tiny model.
    env:
      NEWS_SOURCE_SCOPE: core
      NEWS_RECIPIENT_SCOPE: primary
      NEWS_BLOCK_REUSED_URLS: '0'
      NEWS_IMAGE_ENABLED: '0'
      NEWS_MODEL: gemma-e2b-tiny
      NEWS_MIN_ARTICLES_PER_STORY: '2'
      NEWS_RELAX_STORY_DRAFTING_GUARDS: '1'
  local-prod:
    name: Local production review
    description: Full source-pool review sent only to the primary recipient without blocking URL
      reuse.
    env:
      NEWS_SOURCE_SCOPE: peripheral
      NEWS_RECIPIENT_SCOPE: primary
      NEWS_BLOCK_REUSED_URLS: '0'
      NEWS_IMAGE_ENABLED: '1'
      NEWS_MODEL: gemma-4-12b-it-4bit
      NEWS_MIN_ARTICLES_PER_STORY: '4'
  loose-local-prod:
    name: Loose local production review
    description: Full source-pool review with explicit clustering knobs for looser
      experiments.
    env:
      NEWS_SOURCE_SCOPE: peripheral
      NEWS_RECIPIENT_SCOPE: primary
      NEWS_BLOCK_REUSED_URLS: '0'
      NEWS_IMAGE_ENABLED: '1'
      NEWS_MODEL: gemma-4-12b-it-4bit
      NEWS_MIN_ARTICLES_PER_STORY: '4'
      NEWS_STORY_CLUSTER_SIMILARITY_THRESHOLD: '0.27'
  prod:
    name: Production
    description: Full source-pool run for active recipients that blocks selected URLs
      from reuse.
    env:
      NEWS_SOURCE_SCOPE: peripheral
      NEWS_RECIPIENT_SCOPE: all
      NEWS_BLOCK_REUSED_URLS: '1'
      NEWS_IMAGE_ENABLED: '1'
      NEWS_MODEL: gemma-4-12b-it-4bit
      NEWS_MIN_ARTICLES_PER_STORY: '4'
