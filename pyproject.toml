[project]
name = "personal_code"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "langchain-openai",
    "langchain-community",
    "langchain",
    "langgraph>=1.1.3",
    "datetime",
    "trafilatura",
    "beautifulsoup4",
    "mlx-lm; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mflux>=0.16.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pillow>=10.0.0",
    "pyyaml>=6.0.3",
    "mlx-vlm>=0.5.0 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[project.scripts]
news = "news_pipeline.cli:main"
todays-news = "news_pipeline.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["news_pipeline*"]
